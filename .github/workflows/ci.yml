name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust — check (all targets) + test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # System deps: bubblewrap for tests/sandbox_isolation.rs, ALSA +
      # pkg-config for alsa-sys (audio support in tos-common)
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y bubblewrap pkg-config libasound2-dev
      # --all-targets also compiles test targets: this is the check that
      # would have caught the face-wayland-linux test drift in Phase 0.
      - name: cargo check
        run: cargo check --workspace --all-targets
      - name: cargo test
        run: cargo test --workspace --no-fail-fast

  svelte-check:
    name: Svelte face — type check (non-blocking until Phase 1)
    runs-on: ubuntu-24.04
    # Known state at Phase 0: 19 pre-existing type errors, concentrated in
    # CommandHub.svelte / SettingsModal / +page.svelte. Phase 1's done-when
    # requires the slice components clean; then this job becomes blocking.
    continue-on-error: true
    defaults:
      run:
        working-directory: face-svelte-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: face-svelte-ui/package-lock.json
      - run: npm ci
      - run: npm run check

  e2e:
    name: Svelte face — Playwright E2E (non-blocking, baseline)
    runs-on: ubuntu-24.04
    # The suite's last local run failed before any test executed: Chromium
    # could not launch in the NixOS dev shell (missing libglib). CI installs
    # the browser and its system deps properly, so this job establishes the
    # suite's real baseline; it becomes blocking once it is green.
    continue-on-error: true
    defaults:
      run:
        working-directory: face-svelte-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: face-svelte-ui/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
