name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust — check (all targets) + test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # System deps: bubblewrap for tests/sandbox_isolation.rs, ALSA +
      # pkg-config for alsa-sys (audio support in tos-common)
      - name: Install system dependencies
        # GTK/WebKitGTK packages are for face-ambient-linux (Phase 1);
        # gtk4-layer-shell is not packaged in Ubuntu 24.04, so it is
        # built from source in the next step.
        run: sudo apt-get update && sudo apt-get install -y bubblewrap pkg-config libasound2-dev libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev libwayland-dev wayland-protocols gobject-introspection meson ninja-build
      - name: Build gtk4-layer-shell (not packaged in 24.04)
        run: |
          git clone --depth 1 --branch v1.3.0 https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          cd /tmp/gtk4-layer-shell
          meson setup build -Dexamples=false -Ddocs=false -Dtests=false -Dvapi=false
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig
      # --all-targets also compiles test targets: this is the check that
      # would have caught the face-wayland-linux test drift in Phase 0.
      - name: cargo check
        run: cargo check --workspace --all-targets
      - name: cargo test
        run: cargo test --workspace --no-fail-fast

  svelte-check:
    name: Svelte face — type check (non-blocking, parked components)
    runs-on: ubuntu-24.04
    # Slice components and all test specs are clean (Phase 1). The
    # remaining errors live in parked components (SettingsModal, editor,
    # Minimap, WorkflowManager, SplitPaneView, Marketplace view); this
    # job becomes blocking when those are fixed or removed.
    continue-on-error: true
    defaults:
      run:
        working-directory: face-svelte-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: face-svelte-ui/package-lock.json
      - run: npm ci
      - run: npm run check

  e2e:
    name: Svelte face — Playwright E2E (non-blocking, baseline)
    runs-on: ubuntu-24.04
    # The suite's last local run failed before any test executed: Chromium
    # could not launch in the NixOS dev shell (missing libglib). CI installs
    # the browser and its system deps properly, so this job establishes the
    # suite's real baseline; it becomes blocking once it is green.
    continue-on-error: true
    defaults:
      run:
        working-directory: face-svelte-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: face-svelte-ui/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The real-Brain specs (Phase 1 slice, chip lifecycle) have their
      # own blocking job below — they need a real Brain binary, which
      # this baseline job does not build.
      - run: npx playwright test --grep-invert "Phase 1 slice|chip lifecycle|Phase 2 — remote config|Phase 2 — reconnect|Phase 2 — three-stream narrowing"

  e2e-slice:
    name: Svelte face — Playwright E2E, gated specs (blocking)
    runs-on: ubuntu-24.04
    # The real-Brain specs run against a REAL tos-brain binary (no
    # WebSocket mocking): the Phase 1 slice spec drives the built face
    # (background terminal, prompt, chips, persistence, reconnect);
    # the chip-lifecycle spec drives a fake headless chip system over
    # the face protocol (ls -> chip request, chip select -> cd, pwd ->
    # new request, deprecation/priority decay). Everything must pass.
    # --workers=1: both specs spawn a Brain on the same ports, so the
    # files must not run in parallel.
    defaults:
      run:
        working-directory: face-svelte-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: face-svelte-ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies (for tos-brain)
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev
      - name: Build the Brain
        working-directory: .
        run: cargo build -p tos-brain
      - run: npm ci
      - name: UI component tests (vitest)
        run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/grid.spec.ts tests/slice.spec.ts tests/chips-lifecycle.spec.ts tests/remote.spec.ts tests/reconnect.spec.ts tests/narrowing.spec.ts tests/placement.spec.ts tests/placement-ui.spec.ts --workers=1
